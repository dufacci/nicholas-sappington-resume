<style>
  :root {
    --bg: #000000;
    --dim: #555555;
    --rule: #222222;
    --white: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    overflow-x: hidden;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: "Courier Prime", monospace;
    text-transform: uppercase;
    color: var(--dim);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Floating cursor tooltip ---------- */
  #cursor-tooltip {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    background: #222222;
    border: 1px solid #444444;
    color: var(--white);
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 4px 8px;
    white-space: nowrap;
    opacity: 0;
    transform: translate(16px, 16px);
    transition: opacity 150ms ease-out;
  }

  /* ---------- Index list ---------- */
  main {
    flex: 1 0 auto;
    display: flex;
    flex-direction: column;
    width: 100%;
    padding: 3rem 0;
  }

  .list-item {
    display: flex;
    flex-direction: row;
    align-items: center;
    width: 100%;
    padding: 1rem;
    border-bottom: 1px solid var(--rule);
    text-decoration: none;
    color: inherit;
    cursor: none;
  }

  .item-index {
    width: 3rem;
    flex-shrink: 0;
    font-size: 0.875rem;
    font-weight: 700;
    color: var(--dim);
  }

  /* Shrink-to-fit so overlays can be centred on the word itself, not the row. */
  .item-text {
    flex: 0 1 auto;
    min-width: 0;
    font-size: 2.5rem;
    line-height: 1.1;
    letter-spacing: -0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .item-arrow {
    flex-shrink: 0;
    margin-left: auto;
    padding-left: 1rem;
    font-size: 2.5rem;
    line-height: 1;
    color: var(--white);
    opacity: 0;
    transition: opacity 200ms ease-out;
  }

  .list-item:hover .item-arrow { opacity: 1; }

  /* ---------- Hover squiggle ---------- */
  /* Sits between the word and the far-right arrow. Draws itself in on hover and
     un-draws on the way out, so a hoverable row reads as clearly interactive. */
  /* Hidden by default: it is a hover affordance, and on a touch screen it would
     only steal width from the word and force it to truncate. */
  .item-squiggle {
    display: none;
    flex: 0 0 auto;
    margin-left: 1.25rem;
    width: 96px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms ease-out;
  }

  @media (hover: hover) and (min-width: 640px) {
    .item-squiggle { display: block; }
  }

  .item-squiggle svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
    fill: none;
    stroke: var(--white);
    /* Paths carry vector-effect="non-scaling-stroke", so this is real screen px
       and stays consistent across the two squiggle sizes. */
    stroke-width: 2.4;
    stroke-linecap: round;
    /* pathLength="1" on each path normalises the draw regardless of real length. */
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7));
    transition: stroke-dashoffset 450ms ease-out;
  }

  .list-item:hover .item-squiggle { opacity: 1; }
  .list-item:hover .item-squiggle svg { stroke-dashoffset: 0; }

  @media (min-width: 768px) {
    main { padding: 6rem 0; }
    .list-item { padding: 1rem 3rem; }
    .item-index { width: 6rem; font-size: 1.125rem; }
    .item-text { font-size: 5rem; }
    .item-arrow { font-size: 4rem; }
    .item-squiggle { width: 170px; margin-left: 2rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .item-squiggle svg { transition: none; stroke-dashoffset: 0; }
  }

  /* ---------- Per-letter hover ---------- */
  /* Base color never changes on line hover — only the individual letter reacts. */
  .item-text .ltr {
    display: inline-block;
    color: var(--dim);
    transition: color 0.3s ease-out;
  }

  /* Rotating palette keyed off each letter's position in the word. */
  .item-text .ltr:nth-child(5n + 1):hover { color: #39FF14; }
  .item-text .ltr:nth-child(5n + 2):hover { color: #FFFF00; }
  .item-text .ltr:nth-child(5n + 3):hover { color: #FF00FF; }
  .item-text .ltr:nth-child(5n + 4):hover { color: #00FFFF; }
  .item-text .ltr:nth-child(5n):hover     { color: rgba(57, 255, 20, 0.5); }

  /* Placeholder rows read as inert. */
  .list-item.is-placeholder { cursor: default; }
  .list-item.is-placeholder .item-arrow { display: none; }

  /* ---------- Under construction ---------- */
  /* Struck through, with the hazard sign sitting over the middle of the word.
     The overlay is pointer-events:none so the per-letter hover still works. */
  .list-item.is-wip { cursor: default; }
  .list-item.is-wip .item-arrow { display: none; }

  .list-item.is-wip .item-text { position: relative; }

  /* Drawn manually rather than with text-decoration: the letters are split into
     inline-block spans, which are atomic inlines that a parent's line-through
     will not cross. */
  .list-item.is-wip .item-text::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 48%;
    height: 0.045em;
    background: var(--dim);
    pointer-events: none;
  }

  .list-item.is-wip .item-text::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 46%;
    width: 0.95em;
    height: 0.95em;
    transform: translate(-50%, -50%) rotate(-9deg);
    background: url("/construction.svg") center / contain no-repeat;
    opacity: 0.55;
    pointer-events: none;
  }

  /* ---------- Footer ---------- */
  footer {
    flex-shrink: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    justify-content: space-between;
    padding: 1.5rem;
    border-top: 1px solid var(--rule);
    font-size: 0.6875rem;
    letter-spacing: 0.15em;
  }

  footer a { color: var(--dim); text-decoration: none; }
  footer a:hover { color: var(--white); }

  @media (min-width: 768px) {
    footer { padding: 1.5rem 3rem; }
  }
</style>
</head>

<script>
  // Split each item's text into per-character spans so hover can target one letter
  // at a time. Spaces become non-breaking so they survive as their own span and
  // keep the :nth-child palette rotation aligned with the visible characters.
  function splitLetters() {
    document.querySelectorAll('.item-text').forEach((el) => {
      const text = el.textContent;
      el.dataset.label = text;
      el.textContent = '';

      const frag = document.createDocumentFragment();
      for (const ch of text) {
        const span = document.createElement('span');
        span.className = 'ltr';
        span.textContent = ch === ' ' ? ' ' : ch;
        frag.appendChild(span);
      }
      el.appendChild(frag);
    });
  }

  function initTooltip() {
    const tooltip = document.getElementById('cursor-tooltip');

    document.addEventListener('mousemove', (e) => {
      tooltip.style.left = e.clientX + 'px';
      tooltip.style.top = e.clientY + 'px';
    });

    document.querySelectorAll('.list-item').forEach((item) => {
      item.addEventListener('mouseenter', () => {
        tooltip.textContent = item.dataset.tip || '';
        tooltip.style.opacity = '1';
      });
      item.addEventListener('mouseleave', () => {
        tooltip.style.opacity = '0';
      });
    });
  }

  splitLetters();
  initTooltip();
</script>
