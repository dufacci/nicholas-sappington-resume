<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NS Resume</title>
    <meta property="og:title" content="NS Resume" />
    <meta property="og:description" content="Nick Sappington — San Francisco Based" />
    <!-- Auto screenshot of the live site via Microlink (free, no key). To revert to the static image, use: https://nicholas-sappington.netlify.app/preview.png -->
    <meta property="og:image" content="https://api.microlink.io/?url=https://nicksappington.com/resume/&amp;screenshot=true&amp;meta=false&amp;embed=screenshot.url&amp;viewport.width=1200&amp;viewport.height=630" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://nicksappington.com/resume/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <!-- Instant loading screen — shown before React mounts, replaced automatically -->
      <div id="splash" style="
        position:fixed; inset:0;
        background:#000;
        display:flex; flex-direction:column;
        align-items:center; justify-content:center;
        font-family:'Courier Prime', monospace; z-index:9999;
      ">
        <!-- Glowing ring spinner -->
        <div style="
          width:56px; height:56px;
          border-radius:50%;
          border:3px solid rgba(233,245,165,0.15);
          border-top-color:#E9F5A5;
          animation:spin 0.9s linear infinite;
          margin-bottom:2rem;
          box-shadow:0 0 24px rgba(233,245,165,0.2);
        "></div>
        <div style="
          font-size:1.1rem; font-weight:700;
          letter-spacing:0.15em; color:#fff;
          text-transform:uppercase; margin-bottom:0.4rem;
        ">Nick Sappington</div>
        <div style="
          font-size:0.65rem; font-weight:700;
          letter-spacing:0.3em; color:#5e5e5e;
          text-transform:uppercase;
        ">San Francisco</div>
        <style>
          @keyframes spin { to { transform:rotate(360deg); } }
          body { margin:0; background:#000; }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
